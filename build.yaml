description: >
  An enhanced fork of tim-vu's Continue Watching plugin. Updates Jellyfin's default resume list
  to work like you expect it to, tracks home videos, reacts to marking items played or unplayed,
  and keeps accurate play counts. Works with and without IAmParadox27's Home Screen Sections plugin.
category: "General"
