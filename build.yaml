changelog: >
  Hides Jellyfin's Next Up list by default, since Continue Watching already shows each series' next
  episode; turn it back on from the plugin's settings page. Finished shows now come back to Continue
  Watching when a new episode is added (this never triggered before). Servers without Home Screen
  Sections no longer log a warning on every start.
