artifacts:
- "Jellyfin.Plugin.ContinueWatching.dll"
- "Jellyfin.Plugin.HomeScreenSections.Client.dll"
changelog: >
  Continue Watching entries now survive an episode's file being replaced (a quality upgrade or a
  move to another library folder) and keep their place in the row, and a replaced or duplicate
  episode no longer brings a finished show back. A show split across library folders gets one entry.
  Clients that sort the row by last-played date (Moonfin, Wholphin) now keep the server's order.
